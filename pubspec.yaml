name: prep_manager
description: Gerenciador de estoque digital
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  intl: 0.20.3
  uuid: ^4.3.3
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: "^0.14.4"
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/Ícone-Control-Estoque-de-Alimentos.png"

flutter_native_splash:
  color: "#07A35D"
  image: assets/inicial.png
  
  # Adicione esta seção para Android 12+
android_12:
  color: "#07A35D"
  image: assets/inicial.png