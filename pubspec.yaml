name: prep_manager
description: Gerenciador de estoque digital
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  intl: 0.20.3
  uuid: ^4.3.3
  flutter_slidable: ^3.1.0
  package_info_plus: ^10.2.2
  flutter_native_splash: ^2.4.4
  # Segurança: trava do app, criptografia, 2FA e backup protegido
  flutter_secure_storage: '>=9.2.4 <11.0.0'
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  google_fonts: ^9.0.0
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/background/DarkMode/
    - assets/background/LightMode/
    - assets/google_fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/Ícone-Control-Estoque-de-Alimentos.png"

flutter_native_splash:
  background_image: assets/Inicial2.png
  fullscreen: true 
  #preserve: true
  background_image_dark: assets/Inicial2.png
  android_12:
    color: "#07A35D"
    color_dark: "#07A35D"